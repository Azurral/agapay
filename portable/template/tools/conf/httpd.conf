# AGAPAY for Windows: web server settings. Written again from this file on every start (tools\start.ps1), so the
# folder can be moved or copied to another laptop. {{HOME}} is the AGAPAY folder.
Define HOME "{{HOME}}"
ServerRoot "${HOME}/apache"
# Only this laptop can open AGAPAY (no firewall prompt, nothing exposed on the network).
Listen 127.0.0.1:8742
ServerName localhost:8742

LoadModule authz_core_module modules/mod_authz_core.so
LoadModule authz_host_module modules/mod_authz_host.so
LoadModule dir_module modules/mod_dir.so
LoadModule env_module modules/mod_env.so
LoadModule headers_module modules/mod_headers.so
LoadModule log_config_module modules/mod_log_config.so
LoadModule mime_module modules/mod_mime.so
LoadModule rewrite_module modules/mod_rewrite.so
LoadModule setenvif_module modules/mod_setenvif.so
LoadModule deflate_module modules/mod_deflate.so
LoadModule filter_module modules/mod_filter.so

LoadModule php_module "${HOME}/php/php8apache2_4.dll"
PHPIniDir "${HOME}/data/conf"
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

# Where AGAPAY keeps its settings and files (outside the program folder, so updates never touch them).
SetEnv AGAPAY_HOME "{{HOME}}"
SetEnv LARAVEL_STORAGE_PATH "{{HOME}}/data/storage"

DocumentRoot "${HOME}/app/public"
<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory "${HOME}/app/public">
    Options FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>
DirectoryIndex index.php index.html

TypesConfig conf/mime.types
AddOutputFilterByType DEFLATE text/html text/css text/javascript application/javascript application/json image/svg+xml

ErrorLog "${HOME}/data/logs/apache-error.log"
LogLevel warn
PidFile "${HOME}/data/logs/httpd.pid"

# Uploads up to 30 MB (Excel masterlists and crisis photos).
LimitRequestBody 31457280
ThreadsPerChild 64
Timeout 300
ServerTokens Prod
ServerSignature Off
