# AGAPAY for Windows: database settings. Written again from this file on every start; {{HOME}} is the AGAPAY folder.
[mysqld]
datadir = "{{HOME}}/data/mysql"
port = 3307
bind-address = 127.0.0.1
character-set-server = utf8mb4
collation-server = utf8mb4_unicode_ci
default-time-zone = "+08:00"
max_allowed_packet = 64M
innodb_buffer_pool_size = 256M
# Every saved record is written to disk at once (safe if the laptop crashes or loses power).
innodb_flush_log_at_trx_commit = 1
sync_binlog = 1
log-error = "{{HOME}}/data/logs/mariadb-error.log"

[client]
port = 3307
host = 127.0.0.1
default-character-set = utf8mb4
