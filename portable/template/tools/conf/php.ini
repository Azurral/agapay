; AGAPAY for Windows: PHP settings. Written again from this file on every start; {{HOME}} is the AGAPAY folder.
[PHP]
engine = On
short_open_tag = Off
precision = 14
output_buffering = 4096
expose_php = Off
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
error_reporting = E_ALL & ~E_DEPRECATED
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = "{{HOME}}/data/logs/php-error.log"
post_max_size = 30M
upload_max_filesize = 25M
max_file_uploads = 20
upload_tmp_dir = "{{HOME}}/data/storage/framework/tmp"
sys_temp_dir = "{{HOME}}/data/storage/framework/tmp"
default_charset = "UTF-8"
file_uploads = On
allow_url_fopen = On
extension_dir = "{{HOME}}/php/ext"

extension=curl
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=openssl
extension=pdo_mysql
extension=sodium
extension=zip

[Date]
date.timezone = Asia/Manila

[curl]
curl.cainfo = "{{HOME}}/php/extras/ssl/cacert.pem"

[openssl]
openssl.cafile = "{{HOME}}/php/extras/ssl/cacert.pem"

[Session]
session.use_strict_mode = 1

[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
