# AGAPAY cloud copy: keep enough PHP workers ready that many staff can start working at once without waiting for Apache
# to start more (its default of 5 made the first seconds of a 30-user load test queue for up to 5 s). Each worker uses
# about 30-40 MB, so 40 workers stay within a small (1-2 GB) server.
<IfModule mpm_prefork_module>
    StartServers             12
    MinSpareServers          12
    MaxSpareServers          24
    ServerLimit              40
    MaxRequestWorkers        40
    MaxConnectionsPerChild   1000
</IfModule>
