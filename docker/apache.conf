# AGAPAY cloud copy. The host's proxy terminates HTTPS and forwards to ${PORT}.
Listen ${PORT}

<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        AllowOverride All
        Require all granted
    </Directory>
    ServerSignature Off
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
