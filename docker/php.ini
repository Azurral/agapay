; AGAPAY cloud copy: the same limits as the office copy (Excel imports up to 25 MB, damage photos, PDF reports).
upload_max_filesize = 25M
post_max_size = 30M
memory_limit = 512M
max_execution_time = 300
date.timezone = Asia/Manila
expose_php = Off
opcache.enable = 1
opcache.validate_timestamps = 0
